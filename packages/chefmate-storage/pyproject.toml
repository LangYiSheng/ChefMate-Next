[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefmate-storage"
version = "0.1.0"
description = "Current-dataset PostgreSQL storage and queries for ChefMate recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "ijson>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
chefmate-storage = "chefmate_storage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chefmate_storage = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
