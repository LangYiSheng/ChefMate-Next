[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefmate-food-data"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["chefmate-contracts>=0.1,<0.2", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
chefmate-usda = "chefmate_food_data.cli:main"
