[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefmate-core"
version = "0.1.0"
description = "Reusable recipe extraction and local USDA nutrition processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["chefmate-contracts>=0.1,<0.2", "chefmate-food-data>=0.1,<0.2", "chefmate-recipe-processing>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
