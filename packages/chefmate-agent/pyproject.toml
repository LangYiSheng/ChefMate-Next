[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefmate-agent"
version = "0.1.0"
description = "Bounded, evidence-driven ChefMate conversational agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chefmate-retrieval>=0.1.0",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../chefmate-retrieval/src", "../chefmate-storage/src", "../chefmate-contracts/src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
