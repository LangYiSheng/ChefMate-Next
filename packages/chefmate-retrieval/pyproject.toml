[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chefmate-retrieval"
version = "0.1.0"
description = "Validated read-only ingredient and recipe tools for ChefMate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["chefmate-contracts>=0.1,<0.2", "chefmate-storage>=0.1,<0.2", "chefmate-food-data>=0.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../chefmate-storage/src", "../chefmate-contracts/src", "../chefmate-food-data/src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
