<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>设置 · ChefMate</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/colors.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/shell.css" />
    <link rel="stylesheet" href="/static/centers.css" />
    <link rel="stylesheet" href="/static/settings.css" />
    <link rel="stylesheet" href="/static/form-controls.css" />
    <link rel="stylesheet" href="/static/typography.css" />
    <script type="module" src="/static/settings.js"></script>
    <script type="module" src="/static/memory-settings.js"></script>
  </head>
  <body>
    <main class="settings-page">
      <nav class="settings-nav" aria-label="设置分类，可左右滑动或使用方向键切换" tabindex="0">
        <a class="settings-brand" href="/"><img class="brand-icon" data-chefmate-icon src="/static/brand/friendly-pot.svg" alt=""><span>ChefMate</span></a>
        <a class="back-link" href="/"><span data-icon="arrow-left" aria-hidden="true"></span> 返回对话</a>
        <h2>偏好</h2>
        <button type="button" data-section="display">
          <span data-icon="sun-moon" aria-hidden="true"></span> <span>外观与对话</span>
        </button>
        <button type="button" data-section="cooking">
          <span data-icon="timer" aria-hidden="true"></span> <span>烹饪与计时</span>
        </button>
        <button type="button" data-section="memory"><span data-icon="book-open" aria-hidden="true"></span> <span>长期记忆</span></button>
        <h2>智能体</h2>
        <button type="button" data-section="model">
          <span data-icon="plug" aria-hidden="true"></span> <span>模型连接</span>
        </button>
        <button type="button" data-section="components">
          <span data-icon="chef-hat" aria-hidden="true"></span> <span>系统组件</span>
        </button>
        <button type="button" data-section="usage"><span data-icon="layers" aria-hidden="true"></span> <span>Token 用量</span></button>
        <details class="settings-advanced"><summary>高级设置</summary>
        <button type="button" data-section="context">
          <span data-icon="layers" aria-hidden="true"></span> <span>上下文预算</span>
        </button>
        <button type="button" data-section="runtime">
          <span data-icon="sliders-horizontal" aria-hidden="true"></span> <span>执行设置</span>
        </button>
        <button type="button" data-section="developer"><span data-icon="code-xml" aria-hidden="true"></span> <span>开发者</span></button>
        </details>
        <button type="button" data-section="about"><span data-icon="info" aria-hidden="true"></span> <span>关于 ChefMate</span></button>
      </nav>
      <section class="settings-workspace">
        <header class="settings-header">
          <div>
            <h1 id="section-title">外观与对话</h1>
            <p id="section-description"></p>
          </div>
          <a href="/" aria-label="返回工作台" class="icon-button" data-icon="x"></a>
        </header>
        <div id="settings-tabs" class="settings-tabs" role="tablist" aria-label="当前设置的选项" hidden></div>
        <div class="settings-content">
          <p id="settings-message" role="status" hidden></p>
          <form id="settings-form"></form>
        </div>
        <footer class="settings-footer">
          <span id="save-state" role="status">正在读取设置…</span>
          <div>
            <button id="reload-settings" type="button" class="text-button">
              重新读取</button
            ><button
              id="save-settings"
              type="button"
              class="primary-button"
              disabled
            >
              保存修改
            </button>
          </div>
        </footer>
      </section>
    </main>
    <dialog id="settings-confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title">保留未保存的修改？</h2>
      <p id="confirm-description">离开后，尚未保存的设置会丢失。</p>
      <div><button id="cancel-confirm" type="button" class="secondary-button">继续编辑</button><button id="accept-confirm" type="button" class="primary-button">放弃修改</button></div>
    </dialog>
  </body>
</html>
