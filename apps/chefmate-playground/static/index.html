<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2f4f2">
  <title>ChefMate · 您的个性化烹饪助手</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/colors.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/workspace.css">
  <link rel="stylesheet" href="/static/experience.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/focus.css">
  <link rel="stylesheet" href="/static/activity.css">
  <link rel="stylesheet" href="/static/conversation.css">
  <link rel="stylesheet" href="/static/question.css">
  <link rel="stylesheet" href="/static/cooking.css">
  <link rel="stylesheet" href="/static/timer-popover.css">
  <link rel="stylesheet" href="/static/typography.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body class="app-page">
  <a class="skip-link" href="#composer-input">跳到输入框</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="ChefMate 首页">
          <img class="brand-icon" data-chefmate-icon src="/static/brand/friendly-pot.svg" alt="">
          <span class="brand-copy"><strong>ChefMate</strong><small>您的个性化烹饪助手</small></span>
        </a>
        <button class="icon-button desktop-only" id="collapse-sidebar" type="button" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true" data-icon="panel-left-close"></button>
        <button class="icon-button mobile-only" id="close-sidebar" type="button" aria-label="收起会话导航" data-icon="x"></button>
      </div>
      <button class="new-chat" id="new-chat" type="button"><span data-icon="plus" aria-hidden="true"></span><span class="new-chat-label">新会话</span></button>
      <nav id="primary-navigation" class="primary-navigation" aria-label="厨房空间">
        <button type="button" data-primary-page="journal"><span data-icon="utensils" aria-hidden="true"></span><span>食光手记</span></button>
        <button type="button" data-primary-page="recipes"><span data-icon="book-open" aria-hidden="true"></span><span>菜谱中心</span></button>
      </nav>
      <div class="sidebar-heading">最近会话</div>
      <nav class="sessions" id="sessions" aria-label="最近会话"></nav>
      <div class="sidebar-footer"><a class="settings-link" href="/settings"><span data-icon="settings" aria-hidden="true"></span><span>设置</span></a></div>
      <div id="sidebar-resize" class="sidebar-resize" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-valuemin="208" aria-valuemax="360" aria-valuenow="248" tabindex="0"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-button expand-sidebar desktop-only" id="expand-sidebar" type="button" aria-label="展开侧栏" aria-controls="sidebar" data-icon="panel-left-open"></button>
          <button class="icon-button mobile-only" id="open-sidebar" type="button" aria-label="展开会话导航" aria-controls="sidebar" aria-expanded="false" data-icon="panel-left"></button>
          <span id="chat-title">菜谱助手</span>
          <span class="conversation-stage" id="conversation-stage" hidden></span>
          <button type="button" id="current-kitchen" class="current-kitchen-button" hidden>查看本次做菜</button>
        </div>
        <div class="topbar-actions">
          <button class="timer-trigger" id="chat-timer-toggle" data-timer-trigger type="button" aria-label="打开厨房计时" aria-haspopup="dialog" aria-expanded="false" aria-controls="kitchen-timer-popover" hidden></button>
          <button class="status-pill" id="status-button" type="button" aria-label="查看连接状态" hidden><span class="status-dot" id="status-dot" aria-hidden="true"></span><span id="status-label">连接中</span></button>
          <button class="icon-button panel-toggle" id="toggle-details" type="button" aria-label="展开厨房工作区" aria-controls="detail-panel" aria-expanded="false" data-icon="panel-right" hidden></button>
        </div>
      </header>

      <div class="connection-banner" id="connection-banner" role="status" hidden></div>
      <div class="conversation" id="conversation" tabindex="-1" aria-label="聊天记录">
        <section class="welcome" id="welcome">
          <img class="welcome-icon" data-chefmate-icon src="/static/brand/friendly-pot.svg" alt="">
          <h1>今天想吃什么？</h1>
          <p>说说食材、时间和人数，<br class="welcome-break">一起选菜、备菜，把这顿饭做好。</p>
          <div id="welcome-templates" class="starter-templates" aria-label="试试这些开场"></div>
          <button class="starter-shuffle" id="shuffle-templates" type="button"><span data-icon="refresh-cw" aria-hidden="true"></span>换一组灵感</button>
        </section>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-area">
        <section id="question-composer" class="question-composer" aria-label="回答助手的问题" hidden></section>
        <button id="resume-draft" class="resume-draft" type="button" hidden><span data-icon="undo-2" aria-hidden="true"></span>继续未发送的消息</button>
        <div id="composer-choices" class="composer-choices" aria-label="当前表单操作" hidden></div>
        <div id="reply-suggestions" class="reply-suggestions" aria-label="接下来可以聊" hidden></div>
        <div id="image-drafts" class="image-drafts" aria-label="待发送图片" hidden></div>
        <span id="image-status" class="image-status" role="status" hidden></span>
        <button type="button" class="workspace-context" id="workspace-context" hidden></button>
        <div class="turn-status" id="turn-status" role="status" hidden></div>
        <form class="composer" id="composer">
          <label class="visually-hidden" for="composer-input">告诉 ChefMate 你想吃什么</label>
          <textarea id="composer-input" rows="1" placeholder="告诉我想吃什么，也可以补充条件…" maxlength="8000" autocomplete="off"></textarea>
          <div class="composer-bottom">
            <button class="attach-button" id="attach-image" type="button" aria-label="上传图片" title="上传图片 · 自动压缩" hidden data-icon="image-plus"></button>
            <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" multiple hidden>
            <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
            <button class="send-button" id="send-button" type="submit" aria-label="发送消息" disabled data-icon="arrow-up"></button>
            <button class="send-button stop-button" id="stop-button" type="button" aria-label="停止本次执行" hidden data-icon="square"></button>
          </div>
        </form>
      </div>
      <section id="settings-host" class="settings-host" aria-label="工作台设置" hidden><iframe id="settings-frame" title="ChefMate 设置"></iframe></section>
    </main>

    <aside class="detail-panel" id="detail-panel" aria-label="厨房工作区" hidden>
      <div class="panel-header">
        <div class="panel-tabs" role="tablist" aria-label="详情内容">
          <button type="button" class="panel-tab active" id="workspace-tab" role="tab" aria-selected="true" aria-controls="workspace-content">工作区</button>
          <button type="button" class="panel-tab" id="query-tab" role="tab" aria-selected="false" aria-controls="query-content">调试</button>
          <button type="button" class="panel-tab" id="recipe-tab" role="tab" aria-selected="false" aria-controls="recipe-content">菜谱详情</button>
          <button type="button" class="panel-tab" id="components-tab" role="tab" aria-selected="false" aria-controls="components-content">组件</button>
        </div>
        <button class="icon-button" id="close-details" type="button" aria-label="收起详情面板" data-icon="x"></button>
      </div>
      <div class="panel-content workspace-content" id="workspace-content" role="tabpanel" aria-labelledby="workspace-tab"></div>
      <div class="panel-content" id="query-content" role="tabpanel" aria-labelledby="query-tab" hidden></div>
      <div class="panel-content" id="recipe-content" role="tabpanel" aria-labelledby="recipe-tab" hidden></div>
      <div class="panel-content" id="components-content" role="tabpanel" aria-labelledby="components-tab" hidden></div>
    </aside>
  </div>
  <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="关闭侧栏" hidden></button>
  <div class="toast" id="toast" role="status" hidden></div>
  <section class="kitchen-focus" id="kitchen-focus" role="dialog" aria-modal="true" aria-labelledby="focus-title" hidden>
    <header class="focus-header">
      <div class="focus-heading"><span id="focus-stage" class="focus-stage" hidden>厨房工作台</span><h2 id="focus-title">这一餐，慢慢来</h2><span id="focus-subtitle" class="focus-header-progress"></span></div>
      <div class="focus-header-actions"><button class="focus-button" id="exit-focus" type="button" aria-label="返回聊天" title="返回聊天"><span data-icon="arrow-left" aria-hidden="true"></span></button><button class="timer-trigger" id="focus-timer-toggle" data-timer-trigger type="button" aria-label="打开厨房计时" aria-haspopup="dialog" aria-expanded="false" aria-controls="kitchen-timer-popover" hidden></button></div>
    </header>
    <nav class="focus-modes" aria-label="厨房工作区">
      <span id="focus-work-label" class="focus-work-label">专心准备</span>
      <button id="focus-work-toggle" type="button" aria-controls="focus-workspace" hidden></button>
      <button id="focus-talk-toggle" type="button" aria-controls="focus-assistant" aria-expanded="false"><span data-icon="message-circle" aria-hidden="true"></span><span>展开交流</span></button>
      <button id="focus-suggestions-toggle" class="focus-suggestions-toggle" type="button" aria-controls="reply-suggestions" aria-expanded="false" hidden><span data-icon="ellipsis" aria-hidden="true"></span>接着聊</button>
    </nav>
    <div id="focus-body" class="focus-body">
      <div class="focus-deck" id="focus-workspace">
        <div id="focus-tools" class="focus-tools"></div>
        <div class="focus-content" id="focus-content" tabindex="0"></div>
        <nav class="focus-pagination" id="focus-content-pages" aria-label="工作内容分页"></nav>
      </div>
      <section class="focus-assistant focus-deck" id="focus-assistant" aria-label="与厨房助手交流" hidden>
        <div id="focus-reply" class="focus-reply" tabindex="0" aria-label="全屏模式中的对话"></div>
        <nav class="focus-pagination" id="focus-reply-pages" aria-label="助手回复分页"></nav>
      </section>
    </div>
    <footer class="focus-footer">
      <button id="finish-meal" class="finish-meal primary-button" type="button" hidden><span data-icon="check-check" aria-hidden="true"></span>完成本次菜肴</button>
      <div id="focus-activity" class="focus-activity" role="status" hidden></div>
      <div class="focus-quick-prompts" id="focus-prompts"></div>
      <div id="focus-composer-slot" class="focus-composer-slot"></div>
    </footer>
  </section>
  <div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>
</body>
</html>
